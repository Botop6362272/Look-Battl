<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Look Battle</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0c10;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1f2833;
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #333;
      position: relative;
    }
    .gigachad-glow {
      border: 2px solid #ffd700 !important;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6) !important;
    }
    .avatar-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 15px;
    }
    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #45f3ff;
      background: #0b0c10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }
    .rank-badge {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 20px;
      background: #252a34;
      display: inline-block;
      margin-bottom: 8px;
      color: #45f3ff;
    }
    .gigachad-badge {
      background: linear-gradient(45deg, #ff0055, #ffdd00);
      color: #000;
      animation: pulse 1.5s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }
    .elo-display {
      font-size: 32px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 15px;
    }
    .elo-val {
      color: #45f3ff;
    }
    .btn {
      background: linear-gradient(135deg, #45f3ff, #ff0055);
      border: none;
      color: white;
      padding: 16px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 800;
      width: 100%;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(69, 243, 255, 0.3);
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-secondary {
      background: #2b2e3a;
      box-shadow: none;
      font-size: 15px;
      color: #ccc;
    }
    .battle-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 380px;
    }
    .candidate {
      position: relative;
      background: #1f2833;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .candidate:active {
      border-color: #ff0055;
      transform: scale(0.98);
    }
    .candidate img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }
    .candidate-info {
      padding: 12px;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      background: rgba(0,0,0,0.4);
    }
    .vs-divider {
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      color: #ff0055;
      text-shadow: 0 0 10px rgba(255,0,85,0.5);
    }
    .hidden {
      display: none !important;
    }
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Экран профиля -->
  <div id="profile-screen" class="card">
    <div id="rank-badge" class="rank-badge">🐣 Новичок</div>
    <div class="avatar-wrapper">
      <div id="avatar-box" class="avatar">🗿</div>
    </div>
    <h2 id="username" style="margin-bottom: 6px;">Игрок</h2>
    
    <div class="elo-display"><span id="elo-val" class="elo-val">0</span> <span style="font-size: 18px; color: #888;">ELO</span></div>
    
    <label class="btn btn-secondary">
      📷 Загрузить своё фото
      <input type="file" id="photo-input" accept="image/*" onchange="uploadPhoto(event)">
    </label>
    
    <button class="btn" onclick="startBattle()">🔥 ИСКАТЬ ДУЭЛЬ</button>
  </div>

  <!-- Экран баттла -->
  <div id="battle-screen" class="battle-container hidden">
    <h3 style="text-align: center; color: #aaa;">Кто выглядит лучше?</h3>
    
    <div class="candidate" onclick="vote(1)">
      <img id="p1-img" src="" alt="Участник 1">
      <div class="candidate-info" id="p1-name">Участник #1</div>
    </div>

    <div class="vs-divider">VS</div>

    <div class="candidate" onclick="vote(2)">
      <img id="p2-img" src="" alt="Участник 2">
      <div class="candidate-info" id="p2-name">Участник #2</div>
    </div>

    <button class="btn btn-secondary" onclick="showProfile()">⬅ В профиль</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      if (tg.initDataUnsafe?.user) {
        document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
      }
    }

    let userElo = parseInt(localStorage.getItem('user_elo')) || 0;
    
    function updateRankDisplay() {
      const eloElem = document.getElementById('elo-val');
      const badgeElem = document.getElementById('rank-badge');
      const cardElem = document.getElementById('profile-screen');
      
      eloElem.innerText = userElo;
      
      cardElem.classList.remove('gigachad-glow');
      badgeElem.classList.remove('gigachad-badge');

      if (userElo >= 3000) {
        badgeElem.innerText = '🗿 МЕГА ГИГАЧАД';
        badgeElem.classList.add('gigachad-badge');
        cardElem.classList.add('gigachad-glow');
        eloElem.style.color = '#ffd700';
      } else if (userElo >= 2000) {
        badgeElem.innerText = '🔥 Легенда';
        eloElem.style.color = '#ff0055';
      } else if (userElo >= 1000) {
        badgeElem.innerText = '⚡ Гигачад';
        eloElem.style.color = '#ff7e5f';
      } else if (userElo >= 600) {
        badgeElem.innerText = '👑 Красавчик';
        eloElem.style.color = '#45f3ff';
      } else if (userElo >= 300) {
        badgeElem.innerText = '🔥 Опыт';
        eloElem.style.color = '#00ff88';
      } else {
        badgeElem.innerText = '🐣 Новичок';
        eloElem.style.color = '#ffffff';
      }
    }

    updateRankDisplay();

    const savedPhoto = localStorage.getItem('user_photo');
    if (savedPhoto) {
      document.getElementById('avatar-box').innerHTML = `<img src="${savedPhoto}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
    }

    function uploadPhoto(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgUrl = e.target.result;
          localStorage.setItem('user_photo', imgUrl);
          document.getElementById('avatar-box').innerHTML = `<img src="${imgUrl}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
        };
        reader.readAsDataURL(file);
      }
    }

    function startBattle() {
      document.getElementById('profile-screen').classList.add('hidden');
      document.getElementById('battle-screen').classList.remove('hidden');
      loadNextPair();
    }

    function showProfile() {
      document.getElementById('battle-screen').classList.add('hidden');
      document.getElementById('profile-screen').classList.remove('hidden');
      updateRankDisplay();
    }

    // База реальных портретов с Unsplash
    const portraitIds = [
      "1534528741775-53994a69daeb",
      "1507003211169-0a1dd7228f2d",
      "1500648767791-00dcc994a43e",
      "1494790108377-be9c29b29330",
      "1517841905240-472988babdf9",
      "1539571696357-5a69c17a67c6",
      "1524504388940-b1c1722653e1",
      "1501196354995-cbb51c65aaea",
      "1529626455594-4ff0802cfb7e",
      "1488426862026-3ee34a7d66df"
    ];

    function getRandomPortrait() {
      const userPhoto = localStorage.getItem('user_photo');
      // Ипользуем загруженное фото игрока с вероятностью 30%
      if (userPhoto && Math.random() < 0.3) {
        return { src: userPhoto, name: document.getElementById('username').innerText };
      }
      const randomId = portraitIds[Math.floor(Math.random() * portraitIds.length)];
      const randomNum = Math.floor(Math.random() * 900) + 100;
      return { 
        src: `https://images.unsplash.com/photo-${randomId}?auto=format&fit=crop&w=400&q=80`, 
        name: `Игрок #${randomNum}` 
      };
    }

    function loadNextPair() {
      const p1 = getRandomPortrait();
      let p2 = getRandomPortrait();
      
      while (p1.src === p2.src) {
        p2 = getRandomPortrait();
      }

      document.getElementById('p1-img').src = p1.src;
      document.getElementById('p1-name').innerText = p1.name;
      document.getElementById('p2-img').src = p2.src;
      document.getElementById('p2-name').innerText = p2.name;
    }

    function vote(candidateNumber) {
      userElo += 15;
      localStorage.setItem('user_elo', userElo);
      
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }
      
      loadNextPair();
    }
  </script>
</body>
</html>
