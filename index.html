<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Look Battle</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0c10;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1f2833;
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #333;
    }
    .gigachad-glow {
      border: 2px solid #ffd700 !important;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6) !important;
    }
    .avatar-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 15px;
    }
    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #45f3ff;
      background: #0b0c10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }
    .rank-badge {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 20px;
      background: #252a34;
      display: inline-block;
      margin-bottom: 8px;
      color: #45f3ff;
    }
    .gigachad-badge {
      background: linear-gradient(45deg, #ff0055, #ffdd00);
      color: #000;
    }
    .elo-display { font-size: 32px; font-weight: 900; margin-bottom: 15px; }
    .elo-val { color: #45f3ff; }
    .btn {
      background: linear-gradient(135deg, #45f3ff, #ff0055);
      border: none;
      color: white;
      padding: 16px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 800;
      width: 100%;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-secondary { background: #2b2e3a; color: #ccc; font-size: 15px; }
    .battle-container { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 380px; }
    .candidate {
      background: #1f2833;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
    }
    .candidate img { width: 100%; height: 240px; object-fit: cover; display: block; }
    .candidate-info { padding: 12px; text-align: center; font-size: 16px; font-weight: bold; background: rgba(0,0,0,0.4); }
    .vs-divider { text-align: center; font-size: 22px; font-weight: 900; color: #ff0055; }
    .hidden { display: none !important; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <!-- Профиль -->
  <div id="profile-screen" class="card">
    <div id="rank-badge" class="rank-badge">🐣 Новичок</div>
    <div class="avatar-wrapper">
      <div id="avatar-box" class="avatar">🗿</div>
    </div>
    <h2 id="username" style="margin-bottom: 6px;">Игрок</h2>
    <div class="elo-display"><span id="elo-val" class="elo-val">0</span> <span style="font-size: 18px; color: #888;">ELO</span></div>
    
    <label class="btn btn-secondary">
      📷 Загрузить своё фото в Баттл
      <input type="file" id="photo-input" accept="image/*" onchange="uploadPhoto(event)">
    </label>
    
    <button class="btn" onclick="startBattle()">🔥 ИСКАТЬ ДУЭЛЬ</button>
  </div>

  <!-- Баттл -->
  <div id="battle-screen" class="battle-container hidden">
    <h3 style="text-align: center; color: #aaa;">Кто выглядит лучше?</h3>
    
    <div class="candidate" onclick="vote(1)">
      <img id="p1-img" src="" alt="Участник 1">
      <div class="candidate-info" id="p1-name">Загрузка...</div>
    </div>

    <div class="vs-divider">VS</div>

    <div class="candidate" onclick="vote(2)">
      <img id="p2-img" src="" alt="Участник 2">
      <div class="candidate-info" id="p2-name">Загрузка...</div>
    </div>

    <button class="btn btn-secondary" onclick="showProfile()">⬅ В профиль</button>
  </div>

  <script>
    // Инициализация Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDFLdpNyVPtYlrjHsuyJ_TSI8DZSMqy-EM",
      authDomain: "jsh737-c4bb3.firebaseapp.com",
      projectId: "jsh737-c4bb3",
      storageBucket: "jsh737-c4bb3.firebasestorage.app",
      messagingSenderId: "517665430077",
      appId: "1:517665430077:web:0c79bdcf24023d254e6854",
      databaseURL: "https://jsh737-c4bb3-default-rtdb.europe-west1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const tg = window.Telegram?.WebApp;
    let userId = 'user_' + Math.floor(Math.random() * 1000000);
    let userName = 'Игрок';

    if (tg) {
      tg.expand();
      if (tg.initDataUnsafe?.user) {
        userId = 'tg_' + tg.initDataUnsafe.user.id;
        userName = tg.initDataUnsafe.user.first_name;
      }
    }
    document.getElementById('username').innerText = userName;

    let userElo = parseInt(localStorage.getItem('user_elo')) || 0;

    function updateRankDisplay() {
      const eloElem = document.getElementById('elo-val');
      const badgeElem = document.getElementById('rank-badge');
      const cardElem = document.getElementById('profile-screen');
      eloElem.innerText = userElo;

      if (userElo >= 3000) {
        badgeElem.innerText = '🗿 МЕГА ГИГАЧАД';
        badgeElem.classList.add('gigachad-badge');
        cardElem.classList.add('gigachad-glow');
      } else if (userElo >= 2000) { badgeElem.innerText = '🔥 Легенда'; }
      else if (userElo >= 1000) { badgeElem.innerText = '⚡ Гигачад'; }
      else if (userElo >= 600) { badgeElem.innerText = '👑 Красавчик'; }
      else if (userElo >= 300) { badgeElem.innerText = '🔥 Опыт'; }
      else { badgeElem.innerText = '🐣 Новичок'; }
    }
    updateRankDisplay();

    // Загрузка фото в общую базу
    function uploadPhoto(event) {
      const file = event.target.files[0];
      if (!file) return;

      const img = new Image();
      const reader = new FileReader();

      reader.onload = function(e) {
        img.src = e.target.result;
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = 300;
          canvas.height = 300;
          ctx.drawImage(img, 0, 0, 300, 300);
          
          const compressedPhoto = canvas.toDataURL('image/jpeg', 0.6);
          document.getElementById('avatar-box').innerHTML = `<img src="${compressedPhoto}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;

          // Отправка в общую базу данных Firebase
          db.ref('players/' + userId).set({
            name: userName,
            photo: compressedPhoto,
            elo: userElo
          });
        };
      };
      reader.readAsDataURL(file);
    }

    let allPlayers = [];

    function startBattle() {
      document.getElementById('profile-screen').classList.add('hidden');
      document.getElementById('battle-screen').classList.remove('hidden');

      // Получение всех реальных игроков из Firebase
      db.ref('players').once('value').then((snapshot) => {
        const data = snapshot.val();
        allPlayers = [];
        if (data) {
          Object.keys(data).forEach(key => {
            allPlayers.push(data[key]);
          });
        }
        loadNextPair();
      });
    }

    function showProfile() {
      document.getElementById('battle-screen').classList.add('hidden');
      document.getElementById('profile-screen').classList.remove('hidden');
      updateRankDisplay();
    }

    function loadNextPair() {
      if (allPlayers.length < 2) {
        // Если реальных игроков мало, добавляем заглушку
        document.getElementById('p1-name').innerText = userName;
        document.getElementById('p1-img').src = document.getElementById('avatar-box').querySelector('img')?.src || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400';
        
        document.getElementById('p2-name').innerText = 'Игрок #2';
        document.getElementById('p2-img').src = 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400';
        return;
      }

      const p1 = allPlayers[Math.floor(Math.random() * allPlayers.length)];
      let p2 = allPlayers[Math.floor(Math.random() * allPlayers.length)];
      while (p1 === p2) {
        p2 = allPlayers[Math.floor(Math.random() * allPlayers.length)];
      }

      document.getElementById('p1-img').src = p1.photo;
      document.getElementById('p1-name').innerText = p1.name;
      document.getElementById('p2-img').src = p2.photo;
      document.getElementById('p2-name').innerText = p2.name;
    }

    function vote(candidateNumber) {
      userElo += 15;
      localStorage.setItem('user_elo', userElo);
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      loadNextPair();
    }
  </script>
</body>
</html>
